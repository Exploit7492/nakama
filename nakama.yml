# ============================================
# Nakama Production Configuration
# ============================================

# Database Configuration
#
# The address carries the password, so it is NOT set here. start.sh passes
# it on the command line (--database.address) from DATABASE_URL or from the
# SUPABASE_DB_* environment variables, which override anything in this file.
database:
  conn_pool_max_size: 20
  conn_pool_min_size: 5

# Runtime Configuration
runtime:
  path: "/nakama/data/modules"
  js_entrypoint: "index.js"
  js_cache: true

# Socket Configuration
#
# server_key is a credential: start.sh supplies it from NAKAMA_SERVER_KEY.
socket:
  port: 7350
  max_message_size_bytes: 4096

# HTTP Configuration
http:
  port: 7350
  max_body_size: 3145728
  write_timeout_ms: 5000
  read_timeout_ms: 5000
  idle_timeout_ms: 60000

# Session Configuration
#
# The encryption keys are credentials: start.sh supplies them from
# SESSION_ENCRYPTION_KEY and SESSION_REFRESH_ENCRYPTION_KEY, both of which
# fall back to NAKAMA_SERVER_KEY when unset. Keep them stable across
# restarts or existing sessions are invalidated.
session:
  token_expiry_seconds: 7200
  refresh_token_expiry_seconds: 604800

# Console Configuration
#
# username and password are credentials: start.sh supplies them from
# CONSOLE_USERNAME and CONSOLE_PASSWORD.
console:
  port: 7351
  allowed_origins:
    - "*"

# Logger Configuration - REMOVED file logging to avoid directory issues
logger:
  level: "INFO"
  stdout: true
  # file: "/nakama/data/logs/nakama.log"  # Removed - causes directory issues

# Metrics Configuration
metrics:
  port: 9102
  enabled: false  # Disabled for simpler setup

# Match Configuration
match:
  min: 1
  max: 64
  min_presence: 1
  max_presence: 64

# Leaderboard Configuration
leaderboard:
  cache_max_size: 10000
  cache_expiry_seconds: 60
  rank_cache_expiry_seconds: 60

# Tracker Configuration
tracker:
  max_presence: 100000
  max_events: 1000

# Pipeline Configuration
pipeline:
  max_batch_size: 100
  max_concurrent_rpcs: 100
